# Film & TV plugin conformance gate.
# Runs sdktest golden vectors against the SDK contract on every push, pull
# request and tagged release, plus a weekly scheduled run.
name: conformance

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '43 6 * * 3'
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'plugin-sdk ref to test against'
        required: false
        type: string

jobs:
  fast-conformance:
    name: fast conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: beamfall-plugin-filmtv
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: beamfall-plugin-filmtv/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-filmtv
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: gofmt
        working-directory: beamfall-plugin-filmtv
        run: gofmt -l . | tee /dev/stderr | (! grep -q .)
      - name: vet
        working-directory: beamfall-plugin-filmtv
        run: go vet ./...
      - name: test contracts and per-package coverage
        working-directory: beamfall-plugin-filmtv
        run: python3 .github/workflows/test_depth_gate.py check
      - name: govulncheck
        working-directory: beamfall-plugin-filmtv
        run: go -C tools tool govulncheck -C .. ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128
        with:
          version: v2.15.0
          working-directory: beamfall-plugin-filmtv

  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: beamfall-plugin-filmtv
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: beamfall-plugin-filmtv/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-filmtv
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: race
        working-directory: beamfall-plugin-filmtv
        run: script/gate.sh race

  # Preserve the established required-check name while making both substantive
  # jobs mechanically blocking. They run in parallel; this serial tail only
  # evaluates their conclusions.
  conformance:
    name: conformance
    needs: [fast-conformance, race]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require fast and race lanes
        env:
          FAST_RESULT: ${{ needs.fast-conformance.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$RACE_RESULT" = success

  # Filename and offline-export parsers accept operator-controlled input. Give
  # every discovered target bounded scheduled time without adding live provider
  # calls or a serial fuzz tail to the pull-request gate.
  fuzz:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: .
            target: FuzzParseFilename
          - package: .
            target: FuzzParseTraktCSV
          - package: ./internal/mediaimport
            target: FuzzParseNFO
          - package: ./internal/mediaimport
            target: FuzzParseOrderedLists
          - package: ./internal/mediaimport
            target: FuzzParseWatchStates
          - package: ./internal/foreignimport
            target: FuzzReadForeignWatchRows
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: beamfall-plugin-filmtv
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: beamfall-plugin-filmtv/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-filmtv
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: bounded parser fuzz
        working-directory: beamfall-plugin-filmtv
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_TIME: 20s
        run: script/gate.sh fuzz
